<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HardFix — Gestión móvil</title>
<style>
@import url('https://fonts.cdnfonts.com/css/harabara');
@font-face{font-family:Harabara;src:url('https://fonts.cdnfonts.com/s/14864/Harabara.woff') format('woff');font-weight:400;font-style:normal;font-display:swap}
:root{color-scheme:light dark;--bg:light-dark(#f5f6f8,#0b0d10);--surface:light-dark(#fff,#15181d);--surface2:light-dark(#f0f2f5,#1c2026);--text:light-dark(#111318,#f4f5f7);--muted:light-dark(#69707d,#9ba3b1);--border:light-dark(#e3e6eb,#292e36);--accent:light-dark(#111,#fff);--accentText:light-dark(#fff,#111);--ok:light-dark(#16834b,#48c989);--warn:light-dark(#a66500,#f0b45b);}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Harabara,sans-serif}.app{min-height:100vh;background:var(--bg)}
header{padding:22px 18px 12px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:-.6px;font-size:23px}.brand span{font-weight:900;color:var(--text)}.avatar{width:38px;height:38px;border:1px solid var(--border);border-radius:50%;display:grid;place-items:center;font-weight:800}
main{max-width:760px;margin:auto;padding:0 16px 96px}.hello{color:var(--muted);font-size:14px;margin:4px 0 16px}.title{font-size:30px;font-weight:850;letter-spacing:-1px;margin:0 0 18px}.search{display:flex;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:18px}.search input{border:0;outline:0;background:transparent;color:var(--text);width:100%;font-size:15px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}.stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px}.stat b{font-size:25px;display:block}.stat small{color:var(--muted);font-size:12px}.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:12px 2px}.sectionHead h2{font-size:17px;margin:0}.link{font-size:13px;color:var(--muted)}.job{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px;margin:9px 0;cursor:pointer}.jobTop{display:flex;justify-content:space-between;gap:12px}.jobId{font-weight:800;font-size:14px}.jobName{font-weight:750;margin-top:5px}.jobDevice{color:var(--muted);font-size:13px;margin-top:3px}.pill{font-size:11px;font-weight:750;padding:6px 8px;border-radius:999px;background:var(--surface2);white-space:nowrap}.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.jobBottom{display:flex;justify-content:space-between;margin-top:13px;padding-top:11px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}.money{font-weight:800;color:var(--text)}.socialLinks{display:flex;justify-content:center;gap:12px;padding:14px 0 22px}.socialLinks a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;background:light-dark(rgba(255,255,255,.94),rgba(15,17,21,.95));backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;justify-content:center}.navin{width:min(760px,100%);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 8px calc(9px + env(safe-area-inset-bottom))}.navbtn{background:transparent;border:0;color:var(--muted);font-size:11px;padding:7px;cursor:pointer}.navbtn.active{color:var(--text)}.navbtn strong{display:block;font-size:18px;margin-bottom:2px;color:var(--text)}.fab{position:fixed;right:20px;bottom:84px;border:0;border-radius:16px;background:var(--accent);color:var(--accentText);width:52px;height:52px;font-size:25px;box-shadow:0 10px 28px #0003;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{width:min(760px,100%);background:var(--surface);border-radius:22px 22px 0 0;padding:20px 18px 30px}.sheet h2{margin:0 0 16px}.field{margin:10px 0}.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);color:var(--text)}.actions{display:flex;gap:10px;margin-top:16px}.actions button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-weight:750}.actions .primary{background:var(--accent);color:var(--accentText)}
@media(min-width:700px){main{padding-top:18px}.job{transition:transform .15s}.job:hover{transform:translateY(-1px)}}
@media(max-width:600px){
body{font-family:Arial,sans-serif;font-size:17px}
.brand{font-family:Harabara,sans-serif;font-size:28px}
header{padding:20px 16px 14px}
main{padding:0 14px 112px}
.hello{font-size:16px;margin-bottom:14px}
.title{font-size:34px;letter-spacing:-.5px;line-height:1.15}
.search{padding:15px 14px;border-radius:15px}
.search input{font-size:17px}
.cards{gap:7px;margin-bottom:24px}
.stat{padding:13px 10px;border-radius:14px}
.stat b{font-size:25px}
.stat small{font-size:13px;line-height:1.25;display:block;margin-top:4px}
.sectionHead h2{font-size:19px}
.link{font-size:15px}
.job{padding:17px 14px;border-radius:16px;margin:11px 0}
.jobTop{gap:8px}
.jobId{font-size:15px}
.jobName{font-size:18px;line-height:1.25}
.jobDevice{font-size:15px;line-height:1.35}
.pill{font-size:12px;padding:7px 9px}
.jobBottom{font-size:14px;line-height:1.65;gap:8px}
.money{font-size:15px}
.socialLinks{gap:8px}
.socialLinks a{font-size:15px;padding:12px}
.navin{padding:8px 5px calc(9px + env(safe-area-inset-bottom))}
.navbtn{font-size:13px;padding:8px 3px}
.navbtn strong{font-size:22px}
.fab{width:60px;height:60px;font-size:30px;right:16px;bottom:88px}
.sheet{padding:22px 18px 34px;max-height:90dvh;overflow-y:auto}
.sheet h2{font-size:24px}
.field{margin:13px 0}
.field label{font-size:14px}
.field input,.field select{font-size:16px;padding:14px}
.actions button{font-size:16px;padding:15px 10px}
}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">HARD<span>FIX</span></div><div class="avatar" id="userAvatar">HF</div></header>
<main>
<div class="hello" id="sessionState">Gestión de reparaciones</div><h1 class="title" id="greeting">Buen día 👋</h1>
<div class="search">⌕<input id="search" placeholder="Buscar cliente, equipo o reparación..."></div>
<div class="cards"><div class="stat"><b id="countRepair">—</b><small>En reparación</small></div><div class="stat"><b id="countReady">—</b><small>Listos</small></div><div class="stat"><b id="totalBalance">—</b><small>Por cobrar</small></div></div>
<div class="sectionHead"><h2>Reparaciones recientes</h2><span class="link" id="authAction">Iniciar sesión</span></div>
<div id="jobs"></div>
<div class="socialLinks"><a href="https://www.instagram.com/fixhard/" target="_blank" rel="noopener noreferrer" aria-label="Instagram de HardFix">◎ Instagram</a><a href="https://www.facebook.com/share/19aU1HXHWT/" target="_blank" rel="noopener noreferrer" aria-label="Facebook de HardFix">f Facebook</a></div>
</main>
<button class="fab" id="add" title="Agregar nueva reparación">+</button>
<nav><div class="navin"><button class="navbtn active" data-screen="home"><strong>⌂</strong>Inicio</button><button class="navbtn" data-screen="repairs"><strong>🔧</strong>Reparaciones</button><button class="navbtn" data-screen="clients"><strong>👥</strong>Clientes</button><button class="navbtn" data-screen="cash"><strong>💰</strong>Caja</button></div></nav>
<div class="modal" id="modal"><div class="sheet"><h2>Nueva reparación</h2><div class="field"><label>Cliente</label><input id="newCustomer" placeholder="Nombre y apellido"></div><div class="field"><label>Teléfono</label><input id="newPhone" placeholder="11 1234-5678" inputmode="tel"></div><div class="field"><label>Email</label><input id="newEmail" type="email" placeholder="cliente@email.com"></div><div class="field"><label>Tipo de ingreso</label><select id="newIntakeType"><option>Reparación</option><option>Garantía</option><option>Servicio técnico</option><option>Mantenimiento</option><option>Otro</option></select></div><div class="field"><label>Equipo</label><input id="newEquipment" placeholder="Ej. iPhone 13 / Notebook Lenovo"></div><div class="field"><label>Marca</label><input id="newBrand" placeholder="Ej. Apple, Lenovo, Samsung"></div><div class="field"><label>Modelo</label><input id="newModel" placeholder="Marca y modelo"></div><div class="field"><label>Número de serie / IMEI</label><input id="newSerial" placeholder="Opcional"></div><div class="field"><label>Problema informado</label><input id="newProblem" placeholder="¿Qué falla presenta? "></div><div class="field"><label>Observaciones</label><input id="newNotes" placeholder="Accesorios, estado físico, notas... "></div><div class="field"><label>Estado</label><select id="newStatus"><option>Ingresado</option><option>En diagnóstico</option><option>Esperando repuesto</option><option>Presupuestado</option><option>Aprobado</option><option>En reparación</option><option>Listo para retirar</option><option>Entregado</option></select></div><div class="field"><label>Presupuesto</label><input id="newCost" placeholder="$ 0" inputmode="numeric"></div><div class="field"><label>Seña / pago</label><input id="newPaid" placeholder="$ 0" inputmode="numeric"></div><div class="field"><label>Fecha de entrega estimada</label><input id="newDue" type="date"></div><div class="field"><label>Fecha de entrega real</label><input id="newDelivered" type="date"><small id="warrantyPreview" style="display:block;color:var(--muted);margin-top:6px">Garantía hasta: ingresá la fecha de entrega real</small></div><div class="actions"><button id="close">Cancelar</button><button class="primary" id="save">Guardar reparación</button></div></div></div>
<div class="modal" id="loginModal"><div class="sheet"><h2>Acceso HardFix</h2><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username" placeholder="Email de administración"></div><div class="field"><label>Contraseña</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Contraseña"></div><div class="actions"><button id="loginClose">Cancelar</button><button class="primary" id="loginSave">Ingresar</button></div></div></div>
<script>
const SUPABASE_URL='https://owrihoyixmflhuudbifj.supabase.co';
const SUPABASE_KEY='sb_publishable_H05n5jOBVTTysU1DXWsBTQ_nM1DPCk_';
let currentRows=[];let session=null;
const data=[{id:'#HF-1602',name:'',device:'PC Gamer · HardFix Custom',status:'En reparación',tone:'',money:'—',date:'05/10/2026'},{id:'#HF-1548',name:'Nicolás Carlos',device:'Notebook · Lenovo IdeaPad',status:'Aprobado',tone:'',money:'$60.000',date:'Sin fecha'}];
const jobs=document.querySelector('#jobs');
function money(v){return v==null||v===''?'—':new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(v))}
function addDays(dateString,days){if(!dateString)return '';const d=new Date(dateString+'T12:00:00');d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function formatDate(dateString){return dateString?new Date(dateString+'T12:00:00').toLocaleDateString('es-AR'):'Sin fecha'}
function normalize(x){const delivered=x.delivered_at||x.delivery_date;return {id:'#'+x.order_number,name:x.customer_name||'Cliente sin nombre',device:[x.equipment,x.brand_model].filter(Boolean).join(' · ')||'Equipo sin detalle',status:x.status||'Recibido',tone:x.status==='Listo para retirar'?'ok':(x.status==='Presupuestado'?'warn':''),money:money(x.balance ?? x.cost),date:formatDate(x.received_at),deliveryDate:formatDate(delivered||x.estimated_delivery),warrantyUntil:delivered?(x.warranty_until?formatDate(x.warranty_until):formatDate(addDays(delivered,30))):'Pendiente de entrega',intakeType:x.intake_type||'Reparación'} }
function render(q='',rows=data){jobs.innerHTML=rows.filter(x=>(x.name+x.device+x.id+x.status+(x.intakeType||'')).toLowerCase().includes(q.toLowerCase())).map(x=>`<div class="job"><div class="jobTop"><div><div class="jobId">${x.id}</div><div class="jobName">${x.name}</div><div class="jobDevice">${x.device}</div><div class="jobDevice">Ingreso: ${x.intakeType||'Reparación'}</div></div><span class="pill ${x.tone}">${x.status}</span></div><div class="jobBottom"><span>Ingreso: ${x.date}<br>Entrega: ${x.deliveryDate||'Sin fecha'}<br>Garantía hasta: ${x.warrantyUntil||'Pendiente de entrega'}</span><span class="money">${x.money}</span></div></div>`).join('')||'<div class="job">No encontramos reparaciones.</div>'}
function updateStats(rows){document.querySelector('#countRepair').textContent=rows.filter(x=>x.status==='En reparación').length;document.querySelector('#countReady').textContent=rows.filter(x=>x.status==='Listo para retirar').length;const n=rows.reduce((s,x)=>s+(Number(x.balance)||0),0);document.querySelector('#totalBalance').textContent=money(n)}
function showScreen(screen){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));const title=document.querySelector('#greeting'),head=document.querySelector('.sectionHead h2'),search=document.querySelector('#search');if(screen==='home'){title.textContent='Buen día 👋';head.textContent='Reparaciones recientes';render(search.value,currentRows);return}search.value='';if(screen==='repairs'){title.textContent='Reparaciones';head.textContent='Todas las reparaciones';render('',currentRows);return}if(screen==='clients'){title.textContent='Clientes';head.textContent='Clientes registrados';const names=[...new Set(currentRows.map(x=>x.name).filter(Boolean))];jobs.innerHTML=names.length?names.map(n=>'<div class="job"><div class="jobName">'+n+'</div><div class="jobDevice">'+currentRows.filter(x=>x.name===n).length+' reparación(es)</div></div>').join(''):'<div class="job">Todavía no hay clientes registrados.</div>';return}title.textContent='Caja';head.textContent='Resumen de caja';const total=currentRows.reduce((s,x)=>s+(Number(String(x.money).replace(/[^0-9-]/g,''))||0),0);jobs.innerHTML='<div class="job"><div class="jobName">Total registrado</div><div class="money">'+money(total)+'</div></div><div class="job"><div class="jobName">Por cobrar</div><div class="money">'+document.querySelector('#totalBalance').textContent+'</div></div>'}
async function auth(path,opts={}){return fetch(SUPABASE_URL+path,{...opts,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+(session?.access_token||SUPABASE_KEY),'Content-Type':'application/json',...(opts.headers||{})}})}
function setSession(s){session=s;const logged=!!s;document.querySelector('#sessionState').textContent=logged?'Sesión de administración activa':'Modo operativo';document.querySelector('#greeting').textContent=logged?'Buen día, HardFix 👋':'Buen día 👋';document.querySelector('#authAction').textContent=logged?'Cerrar sesión':'Iniciar sesión';document.querySelector('#add').style.display='block'}
async function login(){document.querySelector('#loginModal').classList.add('show');document.querySelector('#loginEmail').focus()}
async function doLogin(){const email=document.querySelector('#loginEmail').value.trim();const password=document.querySelector('#loginPassword').value;if(!email||!password){alert('Completá email y contraseña.');return}const r=await auth('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});if(!r.ok){let msg='No se pudo iniciar sesión. Revisá el email y la contraseña.';try{const e=await r.json();if(e.msg)msg=e.msg}catch{}alert(msg);return}setSession(await r.json());document.querySelector('#loginModal').classList.remove('show');document.querySelector('#loginPassword').value='';await loadRepairs()}
async function loadRepairs(){try{const r=await auth('/rest/v1/repair_orders?select=*&order=updated_at.desc');if(!r.ok){const err=await r.text();throw new Error(err)}currentRows=(await r.json()).map(normalize);render('',currentRows);updateStats(currentRows)}catch(e){currentRows=data;render('',data);updateStats(data)}}
const dueInput=document.querySelector('#newDue');const deliveredInput=document.querySelector('#newDelivered');const warrantyPreview=document.querySelector('#warrantyPreview');function refreshWarrantyPreview(){const w=addDays(deliveredInput.value,30);warrantyPreview.textContent='Garantía hasta: '+(w?formatDate(w):'ingresá la fecha de entrega real')}deliveredInput.addEventListener('input',refreshWarrantyPreview);render();updateStats(data);setSession(null);loadRepairs();document.querySelector('#search').oninput=e=>render(e.target.value,currentRows);document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>showScreen(b.dataset.screen));document.querySelector('#authAction').onclick=()=>{if(session){session=null;setSession(null);loadRepairs()}else login()};const modal=document.querySelector('#modal');const loginModal=document.querySelector('#loginModal');document.querySelector('#add').onclick=()=>modal.classList.add('show');document.querySelector('#close').onclick=()=>modal.classList.remove('show');document.querySelector('#loginClose').onclick=()=>loginModal.classList.remove('show');document.querySelector('#loginSave').onclick=doLogin;document.querySelector('#loginPassword').onkeydown=e=>{if(e.key==='Enter')doLogin()};document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('show')});document.querySelector('#save').onclick=async()=>{if(!session){loginModal.classList.add('show');return}const cost=Number(document.querySelector('#newCost').value.replace(/[^0-9]/g,''))||0;const paid=Number(document.querySelector('#newPaid').value.replace(/[^0-9]/g,''))||0;const payload={customer_name:document.querySelector('#newCustomer').value.trim()||null,phone:document.querySelector('#newPhone').value.trim()||null,email:document.querySelector('#newEmail').value.trim()||null,intake_type:document.querySelector('#newIntakeType').value,equipment:document.querySelector('#newEquipment').value.trim()||null,brand:document.querySelector('#newBrand').value.trim()||null,brand_model:document.querySelector('#newModel').value.trim()||null,serial_number:document.querySelector('#newSerial').value.trim()||null,reported_problem:document.querySelector('#newProblem').value.trim()||null,notes:document.querySelector('#newNotes').value.trim()||null,status:document.querySelector('#newStatus').value,cost:cost||null,paid:paid||null,balance:Math.max(0,cost-paid),estimated_delivery:dueInput.value||null,delivered_at:deliveredInput.value||null,warranty_until:addDays(deliveredInput.value,30)||null,received_at:new Date().toISOString().slice(0,10)};const r=await auth('/rest/v1/repair_orders',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(payload)});if(!r.ok){let msg='No se pudo guardar la reparación. Puede faltar una columna en la base de datos: ';try{const e=await r.json();if(e.message)msg+=e.message}catch{}alert(msg);return}modal.classList.remove('show');['newCustomer','newPhone','newEmail','newEquipment','newBrand','newModel','newSerial','newProblem','newNotes','newCost','newPaid','newDue','newDelivered'].forEach(id=>document.querySelector('#'+id).value='');document.querySelector('#newIntakeType').value='Reparación';refreshWarrantyPreview();await loadRepairs()};
</script>
</div></body></html>
